name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package
        # Skip code signing / notarization — no Apple Developer ID. Unsigned
        # mac builds require the user to right-click > Open (or `xattr -cr`).
        #
        # USE_HARD_LINKS=false: electron-builder hardlinks node_modules into
        # the app bundle on CI. The mac build packages arm64 then rebuilds
        # sqlite3 for x64 IN PLACE, which rewrote the arm64 bundle's
        # node_sqlite3.node through the shared inode — v0.1.25's arm64 build
        # shipped an x86_64 sqlite3 and crashed on launch on Apple Silicon.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Verify mac native modules match bundle arch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for zip in release/*-mac-*.zip; do
            arch=$(basename "$zip" .zip); arch=${arch##*-}
            [ "$arch" = x64 ] && arch=x86_64   # lipo's name for it
            dir=$(mktemp -d)
            unzip -q "$zip" -d "$dir"
            while IFS= read -r -d '' node; do
              got=$(lipo -archs "$node")
              if [ "$got" != "$arch" ]; then
                echo "::error::$zip: $(basename "$node") is '$got', expected '$arch'"
                status=1
              else
                echo "ok  $zip: $(basename "$node") is $got"
              fi
            done < <(find "$dir" -name '*.node' -print0)
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: ctrlc-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
